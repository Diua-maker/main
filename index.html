<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Painel de Vida Digital</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #18181b; /* zinc-900 */
            --card-border: #27272a; /* zinc-800 */
            --text-primary: #e4e4e7; /* zinc-200 */
            --text-secondary: #a1a1aa; /* zinc-400 */
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-purple: #8b5cf6;
            --nav-bg: #1a1a1a;
            --font-sans: system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-sans);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Utilities */
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .justify-around { justify-content: space-around; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mt-4 { margin-top: 1rem; }
        .text-center { text-align: center; }
        .w-full { width: 100%; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-2xl { border-radius: 1rem; }
        .rounded-full { border-radius: 9999px; }
        .font-bold { font-weight: 700; }
        .text-sm { font-size: 0.875rem; }
        .text-xs { font-size: 0.75rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-3xl { font-size: 1.875rem; }
        
        /* Components */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 1rem;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn:active { transform: scale(0.98); background-color: var(--card-border); }
        .btn-primary { background-color: var(--accent-blue); border-color: var(--accent-blue); color: white; }
        .btn-danger { background-color: rgba(239, 68, 68, 0.1); color: var(--accent-red); border-color: rgba(239, 68, 68, 0.2); }
        
        .input-group { margin-bottom: 1rem; }
        .input-label { display: block; color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 0.25rem; }
        .input-field {
            width: 100%;
            background-color: #27272a;
            border: 1px solid #3f3f46;
            color: white;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 1rem;
        }
        .input-field:focus { outline: 2px solid var(--accent-blue); border-color: transparent; }

        /* Navigation */
        #app-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem;
            padding-bottom: 6rem; /* Space for nav */
        }

        #bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--nav-bg);
            border-top: 1px solid var(--card-border);
            height: 4rem;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 50;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            background: none;
            border: none;
            width: 100%;
            height: 100%;
            gap: 0.25rem;
        }
        .nav-item.active { color: var(--accent-blue); }
        .nav-icon { width: 24px; height: 24px; }
        .nav-label { font-size: 0.65rem; font-weight: 500; }

        /* Progress Bar */
        .progress-bg { background-color: #27272a; height: 0.5rem; border-radius: 9999px; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 0.5s ease; }

        /* Activity Grid */
        .activity-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .activity-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 0.75rem;
            gap: 0.75rem;
        }
        .activity-icon {
            width: 3rem; height: 3rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        /* Canvas */
        canvas { width: 100%; height: auto; }

        /* Animations */
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body>

    <div id="app-content">
        <!-- Views will be injected here -->
    </div>

    <nav id="bottom-nav">
        <button class="nav-item active" onclick="router.navigate('dashboard')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span class="nav-label">Início</span>
        </button>
        <button class="nav-item" onclick="router.navigate('timer')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <span class="nav-label">Tempo</span>
        </button>
        <button class="nav-item" onclick="router.navigate('data')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
            <span class="nav-label">Dados</span>
        </button>
        <button class="nav-item" onclick="router.navigate('goals')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
            <span class="nav-label">Metas</span>
        </button>
        <button class="nav-item" onclick="router.navigate('reports')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
            <span class="nav-label">Relat.</span>
        </button>
    </nav>

    <script>
        // --- STATE MANAGEMENT ---
        const STORAGE_KEY = 'painel_vida_digital_v1';
        
        const INITIAL_STATE = {
            sessions: [],
            currentSessionId: null,
            dataPlan: {
                totalDataGB: 0,
                cost: 0,
                purchaseDate: new Date().toISOString(),
                manualConsumedMB: 0,
                useEstimation: true,
                estimatedMBPerHour: 150,
            },
            goals: {
                maxSocialMediaMinutes: 120,
                minStudyMinutes: 180,
                maxMonthlyBudget: 1000,
            },
            userLevel: 1,
            streak: 0,
            lastActiveDate: new Date().toISOString().split('T')[0],
        };

        const ACTIVITY_CONFIG = {
            study: { label: 'Estudo', color: '#3b82f6', icon: '📖', isProductive: true },
            social: { label: 'Redes Sociais', color: '#ef4444', icon: '📱', isProductive: false },
            leisure: { label: 'Lazer', color: '#10b981', icon: '🎮', isProductive: false },
            sleep: { label: 'Dormir', color: '#8b5cf6', icon: '😴', isProductive: true },
            exercise: { label: 'Exercício', color: '#f59e0b', icon: '🏃', isProductive: true },
        };

        class Store {
            constructor() {
                this.state = this.load();
                this.listeners = [];
                this.checkStreak();
            }

            load() {
                const stored = localStorage.getItem(STORAGE_KEY);
                return stored ? { ...INITIAL_STATE, ...JSON.parse(stored) } : INITIAL_STATE;
            }

            save() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
                this.notify();
            }

            subscribe(listener) {
                this.listeners.push(listener);
            }

            notify() {
                this.listeners.forEach(l => l(this.state));
            }

            update(fn) {
                const updates = fn(this.state);
                this.state = { ...this.state, ...updates };
                this.save();
            }

            checkStreak() {
                const today = new Date().toISOString().split('T')[0];
                if (this.state.lastActiveDate !== today) {
                    this.update(prev => ({
                        lastActiveDate: today,
                        streak: prev.streak + 1
                    }));
                }
            }

            reset() {
                if(confirm('Tem certeza que deseja apagar todos os dados?')) {
                    this.state = INITIAL_STATE;
                    this.save();
                    window.location.reload();
                }
            }

            export() {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.state));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", "backup_vida_digital.json");
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
            }
        }

        const store = new Store();

        // --- ROUTER ---
        const router = {
            currentView: 'dashboard',
            navigate(view) {
                this.currentView = view;
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                document.querySelector(`.nav-item[onclick="router.navigate('${view}')"]`).classList.add('active');
                render();
            }
        };

        // --- HELPERS ---
        const formatTime = (seconds) => {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        };

        const formatHoursShort = (seconds) => {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            return `${h}h ${m}m`;
        };

        // --- VIEWS ---
        
        function renderDashboard() {
            const state = store.state;
            const today = new Date().toISOString().split('T')[0];
            const todaySessions = state.sessions.filter(s => s.date === today);

            // Calculate durations including current active session
            const getDuration = (type) => {
                return todaySessions
                    .filter(s => s.type === type)
                    .reduce((acc, s) => {
                        let duration = s.duration;
                        if (state.currentSessionId === s.id) {
                            duration = Math.floor((Date.now() - s.startTime) / 1000);
                        }
                        return acc + duration;
                    }, 0);
            };

            const studySeconds = getDuration('study');
            const socialSeconds = getDuration('social');
            
            let totalSeconds = 0;
            let productiveSeconds = 0;

            todaySessions.forEach(s => {
                let dur = s.duration;
                if (state.currentSessionId === s.id) {
                    dur = Math.floor((Date.now() - s.startTime) / 1000);
                }
                totalSeconds += dur;
                if (ACTIVITY_CONFIG[s.type].isProductive) {
                    productiveSeconds += dur;
                }
            });

            const productivity = totalSeconds > 0 ? Math.round((productiveSeconds / totalSeconds) * 100) : 0;

            // Data Estimation
            const plan = state.dataPlan;
            const socialHours = socialSeconds / 3600;
            const estimatedDataUsedMB = socialHours * plan.estimatedMBPerHour;
            const costUsed = (estimatedDataUsedMB / 1024) * (plan.totalDataGB > 0 ? plan.cost / plan.totalDataGB : 0);

            return `
                <header class="flex justify-between items-center mb-4">
                    <div>
                        <h1 class="text-2xl font-bold text-white">Olá, Estudante</h1>
                        <p class="text-secondary text-sm">Vamos ser produtivos hoje?</p>
                    </div>
                    <div class="flex items-center gap-1" style="color: var(--accent-amber); background: rgba(245, 158, 11, 0.2); padding: 4px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: bold;">
                        🏆 Nível ${state.userLevel}
                    </div>
                </header>

                <div class="activity-grid mb-4">
                    <div class="card" style="background: rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.2);">
                        <div class="flex items-center gap-2 mb-2" style="color: var(--accent-blue);">
                            <span class="font-bold text-xs uppercase">Estudo</span>
                        </div>
                        <p class="text-2xl font-bold text-white">${formatHoursShort(studySeconds)}</p>
                    </div>
                    <div class="card" style="background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.2);">
                        <div class="flex items-center gap-2 mb-2" style="color: var(--accent-red);">
                            <span class="font-bold text-xs uppercase">Social</span>
                        </div>
                        <p class="text-2xl font-bold text-white">${formatHoursShort(socialSeconds)}</p>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="font-bold text-white">Produtividade</h3>
                        <span class="text-2xl font-bold text-white">${productivity}%</span>
                    </div>
                    <div class="progress-bg">
                        <div class="progress-fill" style="width: ${productivity}%; background: linear-gradient(to right, var(--accent-green), #14b8a6);"></div>
                    </div>
                    <p class="text-secondary text-xs mt-2">
                        ${productivity > 50 ? "Ótimo trabalho! Continue assim." : "Vamos focar um pouco mais?"}
                    </p>
                </div>

                <div class="card">
                    <h3 class="font-bold text-white mb-2">Custo Digital Hoje</h3>
                    <p class="text-secondary text-sm mb-1">
                        Você gastou aprox. <span class="text-white font-bold">${estimatedDataUsedMB.toFixed(0)} MB</span> em redes sociais.
                    </p>
                    <p class="text-secondary text-xs">
                        Isso custou cerca de <span style="color: var(--accent-amber); font-weight: bold;">${costUsed.toFixed(2)} MT</span> do seu pacote.
                    </p>
                </div>
            `;
        }

        function renderTimer() {
            const state = store.state;
            const currentSession = state.currentSessionId ? state.sessions.find(s => s.id === state.currentSessionId) : null;
            
            let timerHtml = '';
            
            if (currentSession) {
                const elapsed = Math.floor((Date.now() - currentSession.startTime) / 1000);
                const config = ACTIVITY_CONFIG[currentSession.type];
                
                timerHtml = `
                    <div class="card text-center relative" style="padding: 3rem 1rem; border-color: ${config.color};">
                        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: ${config.color}; animation: pulse 2s infinite;"></div>
                        <p class="text-secondary text-xs uppercase tracking-wider mb-2">Em andamento</p>
                        <h3 class="text-3xl font-bold mb-4" style="color: ${config.color}">${config.label}</h3>
                        <div class="text-3xl font-mono font-bold text-white mb-8">${formatTime(elapsed)}</div>
                        <button onclick="stopSession()" class="btn btn-danger w-full">
                            ⏹ Parar Atividade
                        </button>
                    </div>
                `;
            } else {
                timerHtml = `
                    <div class="card text-center py-8">
                        <div style="font-size: 3rem; margin-bottom: 1rem; color: var(--text-secondary);">⏱</div>
                        <p class="text-secondary">Nenhuma atividade em andamento</p>
                        <p class="text-secondary text-xs mt-1">Selecione abaixo para iniciar</p>
                    </div>
                `;
            }

            const buttonsHtml = Object.keys(ACTIVITY_CONFIG).map(type => {
                const config = ACTIVITY_CONFIG[type];
                const disabled = !!state.currentSessionId;
                return `
                    <button 
                        onclick="startSession('${type}')" 
                        class="activity-btn" 
                        ${disabled ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : ''}
                    >
                        <div class="activity-icon" style="background: ${config.color}20; color: ${config.color};">
                            ${config.icon}
                        </div>
                        <span class="font-bold text-sm text-white">${config.label}</span>
                    </button>
                `;
            }).join('');

            return `
                <h2 class="text-2xl font-bold text-white mb-4">Cronómetro</h2>
                ${timerHtml}
                <div class="activity-grid mt-4">
                    ${buttonsHtml}
                </div>
            `;
        }

        function renderDataControl() {
            const state = store.state;
            const plan = state.dataPlan;
            
            const totalMB = plan.totalDataGB * 1024;
            let consumedMB = plan.manualConsumedMB;
            
            if (plan.useEstimation) {
                // Simple estimation: sum all social sessions since purchase date
                const purchaseDate = new Date(plan.purchaseDate);
                const socialSessions = state.sessions.filter(s => 
                    s.type === 'social' && new Date(s.date) >= purchaseDate
                );
                const totalSocialHours = socialSessions.reduce((acc, s) => acc + (s.duration / 3600), 0);
                const estimatedConsumption = totalSocialHours * plan.estimatedMBPerHour;
                consumedMB = Math.max(consumedMB, estimatedConsumption);
            }

            const remainingMB = Math.max(0, totalMB - consumedMB);
            const percentUsed = totalMB > 0 ? Math.min(100, (consumedMB / totalMB) * 100) : 0;
            
            // Estimate days remaining
            const daysSincePurchase = Math.max(1, Math.floor((Date.now() - new Date(plan.purchaseDate).getTime()) / (1000 * 60 * 60 * 24)));
            const avgDailyUsageMB = consumedMB / daysSincePurchase;
            const estimatedDaysRemaining = avgDailyUsageMB > 0 ? Math.floor(remainingMB / avgDailyUsageMB) : null;

            return `
                <h2 class="text-2xl font-bold text-white mb-4">Dados Móveis</h2>
                
                <div class="card">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <p class="text-secondary text-sm">Dados Restantes</p>
                            <h3 class="text-3xl font-bold text-white">
                                ${(remainingMB / 1024).toFixed(2)} <span class="text-sm text-secondary">GB</span>
                            </h3>
                        </div>
                        <div style="font-size: 1.5rem; color: ${percentUsed > 90 ? 'var(--accent-red)' : 'var(--accent-green)'}">
                            📶
                        </div>
                    </div>
                    <div class="progress-bg mb-2">
                        <div class="progress-fill" style="width: ${percentUsed}%; background-color: ${percentUsed > 90 ? 'var(--accent-red)' : 'var(--accent-blue)'}"></div>
                    </div>
                    <p class="text-xs text-secondary text-right">${percentUsed.toFixed(1)}% consumido</p>
                    
                    ${estimatedDaysRemaining !== null ? `
                        <p class="text-xs text-secondary mt-2">
                            Estimativa: <span class="text-white font-bold">${estimatedDaysRemaining} dias</span> restantes
                        </p>
                    ` : ''}
                </div>

                <div class="card">
                    <h3 class="font-bold text-white mb-4">Configurar Pacote</h3>
                    <div class="input-group">
                        <label class="input-label">Dados Comprados (GB)</label>
                        <input type="number" class="input-field" value="${plan.totalDataGB}" onchange="updatePlan('totalDataGB', this.value)">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Valor Pago (MT)</label>
                        <input type="number" class="input-field" value="${plan.cost}" onchange="updatePlan('cost', this.value)">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Data da Compra</label>
                        <input type="date" class="input-field" value="${plan.purchaseDate.split('T')[0]}" onchange="updatePlan('purchaseDate', this.value)">
                    </div>
                    <div class="input-group flex items-center gap-2">
                        <input type="checkbox" ${plan.useEstimation ? 'checked' : ''} onchange="updatePlan('useEstimation', this.checked)">
                        <label class="text-secondary text-sm">Estimar consumo por tempo online</label>
                    </div>
                </div>
            `;
        }

        function renderGoals() {
            const state = store.state;
            const goals = state.goals;
            
            const today = new Date().toISOString().split('T')[0];
            const todaySessions = state.sessions.filter(s => s.date === today);
            
            const socialMinutes = todaySessions
                .filter(s => s.type === 'social')
                .reduce((acc, s) => acc + s.duration, 0) / 60;
                
            const studyMinutes = todaySessions
                .filter(s => s.type === 'study')
                .reduce((acc, s) => acc + s.duration, 0) / 60;

            const socialStatus = socialMinutes <= goals.maxSocialMediaMinutes;
            const studyStatus = studyMinutes >= goals.minStudyMinutes;

            return `
                <h2 class="text-2xl font-bold text-white mb-4">Metas & Limites</h2>

                <div class="card flex justify-between items-center" style="background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(245, 158, 11, 0.05)); border-color: rgba(245, 158, 11, 0.2);">
                    <div>
                        <p class="text-sm font-bold uppercase tracking-wider" style="color: var(--accent-amber)">Sequência</p>
                        <h3 class="text-3xl font-bold text-white mt-1">${state.streak} <span class="text-sm font-normal text-secondary">dias</span></h3>
                    </div>
                    <div style="font-size: 2rem;">🎯</div>
                </div>

                <div class="card" style="border-color: ${socialStatus ? 'rgba(16, 185, 129, 0.3)' : 'rgba(239, 68, 68, 0.3)'}">
                    <div class="flex justify-between items-center mb-2">
                        <h4 class="font-bold text-white">Redes Sociais</h4>
                        <span>${socialStatus ? '✅' : '❌'}</span>
                    </div>
                    <p class="text-sm text-secondary mb-2">${Math.round(socialMinutes)} / ${goals.maxSocialMediaMinutes} min</p>
                    <div class="progress-bg">
                        <div class="progress-fill" style="width: ${Math.min(100, (socialMinutes / goals.maxSocialMediaMinutes) * 100)}%; background-color: ${socialStatus ? 'var(--accent-green)' : 'var(--accent-red)'}"></div>
                    </div>
                </div>

                <div class="card">
                    <h3 class="font-bold text-white mb-4">Definir Metas</h3>
                    <div class="input-group">
                        <label class="input-label">Máx. Redes Sociais (min)</label>
                        <input type="number" class="input-field" value="${goals.maxSocialMediaMinutes}" onchange="updateGoal('maxSocialMediaMinutes', this.value)">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Mín. Estudo (min)</label>
                        <input type="number" class="input-field" value="${goals.minStudyMinutes}" onchange="updateGoal('minStudyMinutes', this.value)">
                    </div>
                </div>
            `;
        }

        function renderReports() {
            return `
                <h2 class="text-2xl font-bold text-white mb-4">Relatórios</h2>
                
                <div class="card">
                    <h3 class="text-sm text-secondary mb-2">Horas Totais (7 dias)</h3>
                    <canvas id="chart-hours" height="200"></canvas>
                </div>

                <div class="card">
                    <h3 class="text-sm text-secondary mb-2">Produtividade (%)</h3>
                    <canvas id="chart-prod" height="200"></canvas>
                </div>

                <div class="card mt-4">
                    <button onclick="store.export()" class="btn w-full mb-2">📥 Exportar Backup</button>
                    <button onclick="store.reset()" class="btn btn-danger w-full">🗑 Resetar Tudo</button>
                </div>
            `;
        }

        // --- ACTIONS ---

        function startSession(type) {
            const id = Date.now().toString(36) + Math.random().toString(36).substr(2);
            const newSession = {
                id,
                type,
                startTime: Date.now(),
                endTime: null,
                duration: 0,
                date: new Date().toISOString().split('T')[0],
            };
            store.update(prev => ({
                sessions: [...prev.sessions, newSession],
                currentSessionId: id
            }));
        }

        function stopSession() {
            const state = store.state;
            if (!state.currentSessionId) return;
            
            store.update(prev => {
                const sessions = prev.sessions.map(s => {
                    if (s.id === prev.currentSessionId) {
                        const endTime = Date.now();
                        return {
                            ...s,
                            endTime,
                            duration: Math.floor((endTime - s.startTime) / 1000),
                        };
                    }
                    return s;
                });
                return { sessions, currentSessionId: null };
            });
        }

        function updatePlan(field, value) {
            const val = field === 'useEstimation' ? value : (field === 'purchaseDate' ? new Date(value).toISOString() : Number(value));
            store.update(prev => ({
                dataPlan: { ...prev.dataPlan, [field]: val }
            }));
        }

        function updateGoal(field, value) {
            store.update(prev => ({
                goals: { ...prev.goals, [field]: Number(value) }
            }));
        }

        // --- CHARTING ---
        function drawCharts() {
            const state = store.state;
            const canvasHours = document.getElementById('chart-hours');
            const canvasProd = document.getElementById('chart-prod');
            
            if (!canvasHours || !canvasProd) return;

            const last7Days = Array.from({ length: 7 }, (_, i) => {
                const d = new Date();
                d.setDate(d.getDate() - (6 - i));
                return d.toISOString().split('T')[0];
            });

            const labels = last7Days.map(date => {
                const d = new Date(date);
                return `${d.getDate()}/${d.getMonth() + 1}`;
            });

            // Hours Data
            const hoursData = last7Days.map(date => {
                const daySessions = state.sessions.filter(s => s.date === date);
                return daySessions.reduce((acc, s) => acc + s.duration, 0) / 3600;
            });

            drawBarChart(canvasHours, hoursData, labels, '#3b82f6');

            // Productivity Data
            const prodData = last7Days.map(date => {
                const daySessions = state.sessions.filter(s => s.date === date);
                if (daySessions.length === 0) return 0;
                const prodSec = daySessions.filter(s => ACTIVITY_CONFIG[s.type].isProductive).reduce((acc, s) => acc + s.duration, 0);
                const totalSec = daySessions.reduce((acc, s) => acc + s.duration, 0);
                return (prodSec / totalSec) * 100;
            });

            drawLineChart(canvasProd, prodData, labels, '#10b981');
        }

        function drawBarChart(canvas, data, labels, color) {
            const ctx = canvas.getContext('2d');
            const width = canvas.width = canvas.offsetWidth;
            const height = canvas.height = 200;
            const padding = 30;
            const maxVal = Math.max(...data, 1);

            ctx.clearRect(0, 0, width, height);
            
            const barWidth = (width - padding * 2) / data.length - 10;

            data.forEach((val, i) => {
                const h = (val / maxVal) * (height - padding * 2);
                const x = padding + i * ((width - padding * 2) / data.length) + 5;
                const y = height - padding - h;

                ctx.fillStyle = color;
                ctx.fillRect(x, y, barWidth, h);

                ctx.fillStyle = '#a1a1aa';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(labels[i], x + barWidth / 2, height - 10);
                
                ctx.fillStyle = '#fff';
                ctx.fillText(val.toFixed(1), x + barWidth / 2, y - 5);
            });
        }

        function drawLineChart(canvas, data, labels, color) {
            const ctx = canvas.getContext('2d');
            const width = canvas.width = canvas.offsetWidth;
            const height = canvas.height = 200;
            const padding = 30;
            const maxVal = 100;

            ctx.clearRect(0, 0, width, height);
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;

            data.forEach((val, i) => {
                const x = padding + i * ((width - padding * 2) / (data.length - 1));
                const y = height - padding - (val / maxVal) * (height - padding * 2);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
                
                // Draw point
                // ctx.fillStyle = color;
                // ctx.beginPath();
                // ctx.arc(x, y, 3, 0, Math.PI * 2);
                // ctx.fill();

                ctx.fillStyle = '#a1a1aa';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(labels[i], x, height - 10);
            });
            ctx.stroke();
        }

        // --- RENDER LOOP ---
        function render() {
            const app = document.getElementById('app-content');
            const view = router.currentView;
            
            if (view === 'dashboard') app.innerHTML = renderDashboard();
            else if (view === 'timer') app.innerHTML = renderTimer();
            else if (view === 'data') app.innerHTML = renderDataControl();
            else if (view === 'goals') app.innerHTML = renderGoals();
            else if (view === 'reports') {
                app.innerHTML = renderReports();
                requestAnimationFrame(drawCharts);
            }
        }

        // Initialize
        store.subscribe(render);
        render();

        // Timer Loop
        setInterval(() => {
            if (store.state.currentSessionId) {
                // Only re-render if the current view actually displays the timer (dashboard or timer view)
                // This prevents inputs in 'data' or 'goals' views from losing focus due to re-renders
                if (router.currentView === 'dashboard' || router.currentView === 'timer') {
                    render();
                }
            }
        }, 1000);

    </script>
</body>
</html>
